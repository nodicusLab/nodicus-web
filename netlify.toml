# Configuración de despliegue en Netlify.
# Las páginas se generan con Eleventy (src/ -> _site/) y se publica _site/.
# Solo llega a la web lo que genera el build: tools/, .github/, src/ y el
# README no se publican.
[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"
