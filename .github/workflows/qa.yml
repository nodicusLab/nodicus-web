# Calidad técnica y de redacción del sitio (sobre el HTML que genera Eleventy).
# Corre en cada push a main y en cada pull request, y una vez por semana para
# detectar enlaces externos que se hayan roto aunque no cambie nada en el repo.
name: QA

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # lunes, 06:00 UTC
  workflow_dispatch:

jobs:
  qa:
    name: Build y comprobaciones
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Build (Eleventy)
        run: npm run build
      - name: Comprobaciones SEO (títulos, metas, canonical, JSON-LD, enlaces, sitemap)
        run: python tools/qa_check.py
      - name: Validación HTML
        run: npx --yes html-validate@9 _site
      - name: Enlaces externos
        uses: lycheeverse/lychee-action@v2
        with:
          # Los enlaces internos los revisa qa_check.py (nodicus.com se excluye porque las
          # páginas nuevas aún no existen en producción). LinkedIn responde 999 a los
          # bots; fonts.g* son preconnect, no páginas.
          args: >-
            --no-progress
            --root-dir "${{ github.workspace }}/_site"
            --exclude "^https://nodicus\.com"
            --exclude "linkedin\.com"
            --exclude "fonts\.googleapis\.com$"
            --exclude "fonts\.gstatic\.com"
            '_site/**/*.html'
          fail: true
      # De momento solo informa. Cuando se reescriban los textos se pasará a --strict.
      - name: Redacción anti-IA (informativo)
        run: |
          python tools/lint_copy.py | tee copy-report.txt
          {
            echo '### Redacción anti-IA'
            echo '```'
            cat copy-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
